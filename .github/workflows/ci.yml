name: Room Sensor CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

jobs:
  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck cmake

      - name: Configure host tests (for compile_commands.json)
        run: cmake -S . -B build-host -DBUILD_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Run cppcheck on Application/User
        run: >
          cppcheck --quiet --error-exitcode=1
          --enable=warning,performance,portability
          --suppress=unmatchedSuppression
          --inline-suppr
          --std=c11
          --language=c
          -I Application/User/App/Inc
          -I Application/User/Drivers/veml7700/Inc
          -I Application/User/Drivers/display/Inc
          -I Application/User/Drivers/scd41/Inc
          -I Application/User/Platform/Inc
          -I Application/User/Storage/Inc
          -I Application/User/Telemetry/Inc
          -I Application/User/Communication/Inc
          -I Application/User/Command/Inc
          -I Application/User/Common/Inc
          --suppress=missingIncludeSystem
          Application/User/

  firmware-build:
    # Verifies BOTH Debug and Release firmware configurations. The original Debug
    # job is retained as matrix leg 0 (unchanged behavior); Release is the second
    # leg. Each configuration configures+builds+reports size and runs the
    # fail-closed stack-usage gate. Build dir is per-configuration to avoid
    # collision between the two matrix legs.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi binutils-arm-none-eabi

      - name: Configure firmware
        # Warning policy (-Wall -Wextra -Wpedantic -Werror) is enforced ONLY via
        # target_compile_options on the project-owned `room_sensor` target in
        # CMakeLists.txt. No global C-flags Werror is passed here, so vendor STM32
        # HAL/CMSIS/CubeMX code (separate stm32cubemx/STM32_Drivers targets) is
        # never promoted by project warning policy.
        run: >
          cmake -S . -B build-fw-${{ matrix.build_type }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build firmware
        run: cmake --build build-fw-${{ matrix.build_type }} --target room_sensor --parallel $(nproc) 2>&1

      - name: Firmware size
        run: arm-none-eabi-size build-fw-${{ matrix.build_type }}/room_sensor.elf

      - name: Generate artifacts
        run: |
          arm-none-eabi-objcopy -O binary build-fw-${{ matrix.build_type }}/room_sensor.elf build-fw-${{ matrix.build_type }}/room_sensor.bin
          arm-none-eabi-objcopy -O ihex build-fw-${{ matrix.build_type }}/room_sensor.elf build-fw-${{ matrix.build_type }}/room_sensor.hex

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: room-sensor-firmware-${{ matrix.build_type }}
          path: |
            build-fw-${{ matrix.build_type }}/room_sensor.elf
            build-fw-${{ matrix.build_type }}/room_sensor.bin
            build-fw-${{ matrix.build_type }}/room_sensor.hex
          if-no-files-found: error

      # P2: stack-usage gate. The firmware is built with -fstack-usage, producing one
# *.su file per translation unit. scripts/check_stack_usage.py reports the
# top-N project-owned static frames and enforces a threshold. It FAILS CLOSED:
# if no project-owned .su frames can be measured, CI fails (a missing
# measurement means the quality gate is unavailable). Note the documented
# limitation: per-function static usage is NOT the call-chain total stack.
# Run on BOTH configurations when their compiler emits .su files.
      - name: Report and gate stack usage (fail-closed)
        run: |
          su_files=$(find build-fw-${{ matrix.build_type }} -name '*.su' 2>/dev/null || true)
          if [ -z "$su_files" ]; then
            echo "FAIL-CLOSED: no *.su files produced; stack-usage gate unavailable"
            exit 1
          fi
          python3 scripts/check_stack_usage.py --threshold 2048 $su_files

  portable-core-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc

      - name: Build portable core (no ARM toolchain)
        # Warning policy enforced via target_compile_options in
        # cmake/room_sensor_core.cmake (core_add_library). No global -Werror.
        run: >
          cmake -S . -B build-core
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DBUILD_HOST_PLATFORM=ON
          && cmake --build build-core --parallel $(nproc) 2>&1

  host-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc libc6-dev

      - name: Build host tests
        # Warning policy enforced via add_compile_options in test/CMakeLists.txt
        # (project-owned tests). No global -Werror.
        run: cmake -S . -B build-host -DBUILD_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          && cmake --build build-host --parallel $(nproc)

      - name: Run host tests
        run: ctest --test-dir build-host --output-on-failure --timeout 30

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake gcc libc6-dev

      - name: Build host tests with ASan + UBSan
        # Sanitizer flags must be global (applied at both compile and link).
        # Werror is NOT set here: the project-owned test targets enforce it via
        # add_compile_options in test/CMakeLists.txt, so vendor/system headers
        # compiled into the sanitizer build are never promoted by Werror.
        run: >
          cmake -S . -B build-san
          -DBUILD_HOST_TESTS=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          && cmake --build build-san --parallel $(nproc)

      - name: Run full host suite under sanitizers
        run: ctest --test-dir build-san --output-on-failure --timeout 60

  policy-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check no dynamic memory in Application/User
        run: |
          # Function-call-oriented: match only actual allocation/deallocation
          # CALLS like free(ptr), malloc(...), calloc(...), realloc(...). This
          # does NOT match ordinary prose such as "side-effect-free".
          if grep -rnE '\b(malloc|calloc|realloc|free)[[:space:]]*\(' Application/User/ --include='*.c' --include='*.h' | grep -v 'test/'; then
            echo "ERROR: Dynamic memory malloc/calloc/realloc/free( call found in Application/User"
            exit 1
          fi
          echo "PASS: No dynamic memory malloc/calloc/realloc/free( calls in Application/User"

      - name: Check no HAL_Delay in portable modules
        run: |
          BAD=$(grep -rln 'HAL_Delay' Application/User/App/ Application/User/Drivers/ Application/User/Communication/ Application/User/Command/ Application/User/Telemetry/ Application/User/Storage/ 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: HAL_Delay found in portable modules:"
            echo "$BAD"
            exit 1
          fi
          echo "PASS: No HAL_Delay in portable modules"

      - name: Check no stm32 HAL include in portable modules
        run: |
          BAD=$(grep -rln 'stm32g4xx_hal\.h' Application/User/App/ Application/User/Drivers/ Application/User/Communication/ Application/User/Command/ Application/User/Telemetry/ Application/User/Storage/ 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: stm32g4xx_hal.h included in portable modules:"
            echo "$BAD"
            exit 1
          fi
          echo "PASS: No stm32 HAL include in portable modules"

      - name: Check no HAL I2C/flash/GPIO handle types in portable modules
        run: |
          BAD=$(grep -rln 'I2C_HandleTypeDef\|GPIO_TypeDef\|HAL_StatusTypeDef\|HAL_FLASH\|HAL_IWDG\|HAL_Delay\|HAL_GetTick\|HAL_I2C' Application/User/App/ Application/User/Drivers/ Application/User/Communication/ Application/User/Command/ Application/User/Telemetry/ Application/User/Storage/ 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: STM32 HAL symbols leaked into portable modules:"
            echo "$BAD"
            exit 1
          fi
          echo "PASS: No HAL symbols leaked into portable modules"

      - name: Check no secrets in telemetry/command responses
        run: |
          if grep -rn '"password"\|"token"\|"secret"\|"credential"' Application/User/Telemetry/ Application/User/Command/ --include='*.c' 2>/dev/null; then
            echo "ERROR: Secrets may be serialized"
            exit 1
          fi
          echo "PASS: No secrets serialized"

      # Layering rule: Command must NOT depend on App concrete types. Command
      # communicates downward via the portable CommandRuntimeStatus DTO; App
      # fills it. Block any regressive #include "app.h" / AppStatus usage.
      - name: Check Command has no App dependency
        run: |
          BAD=$(grep -rnE '#include[[:space:]]*["<]app\.h[">]|AppStatus' Application/User/Command/ 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: Command must not depend on App (app.h / AppStatus):"
            echo "$BAD"
            exit 1
          fi
          echo "PASS: Command has no App dependency"

      # Layering rule: Telemetry must NOT depend on App concrete types. It uses
      # only lower-level portable types (room_sensor_types.h / room_state.h).
      # Block any regressive #include "app.h" / AppStatus usage.
      - name: Check Telemetry has no App dependency
        run: |
          BAD=$(grep -rnE '#include[[:space:]]*["<]app\.h[">]|AppStatus' Application/User/Telemetry/ 2>/dev/null || true)
          if [ -n "$BAD" ]; then
            echo "ERROR: Telemetry must not depend on App (app.h / AppStatus):"
            echo "$BAD"
            exit 1
          fi
          echo "PASS: Telemetry has no App dependency"

      # Warning-policy scoping guard: -Werror must be enforced ONLY via
      # target_compile_options / add_compile_options on project-owned targets,
      # NEVER via the global CMAKE_C_FLAGS (which would promote vendor
      # STM32 HAL/CMSIS/CubeMX warnings into project policy failures).
      # Anchored to real `cmake -S` invocations so prose comments never match.
      - name: Assert -Werror is target-scoped, not a global C flag
        run: |
          if grep -rnE 'cmake[[:space:]].*-DCMAKE_C_FLAGS=[^ ]*Werror' .github/ CMakeLists.txt cmake/ test/ --include='*.yml' --include='*.yaml' --include='*.txt' --include='*.cmake' 2>/dev/null; then
            echo "ERROR: Werror passed via global CMAKE_C_FLAGS (vendor HAL/CMSIS promoted). Move to target_compile_options."
            exit 1
          fi
          # Required: every project-owned target applies the warning policy.
          for pat in 'target_compile_options(${CMAKE_PROJECT_NAME} PRIVATE -Wall -Wextra -Wpedantic -Werror' 'target_compile_options(${TARGET} PRIVATE -Wall -Wextra -Wpedantic -Werror)' 'add_compile_options(-Wall -Wextra -Wpedantic -Werror)'; do
            if ! grep -rqF "$pat" CMakeLists.txt cmake/ test/ ; then
              echo "ERROR: missing project-owned warning policy: $pat"
              exit 1
            fi
          done
          echo "PASS: -Werror enforced via target_compile_options on project-owned targets only"